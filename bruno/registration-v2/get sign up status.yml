info:
  name: get registration status
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/v2/sign-up/{{registrationIdempotencyKey}}"
  headers:
    - name: Authorization
      value: "{{authorization}}"
    - name: correlationId
      value: "{{$randomUUID}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
